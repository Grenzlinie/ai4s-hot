name: Update AI4S Hot

on:
  workflow_dispatch:
    inputs:
      failure_probe:
        description: 'Maintenance fault injection; preserves the valid archive and makes no summary requests'
        type: choice
        options: [none, taxonomy, classification]
        default: none
  schedule:
    - cron: '43 23 * * *'
  workflow_run:
    workflows: [Collect Zotero papers]
    types: [completed]
  push:
    branches: [main]
    paths: ['site/static/**', 'site/collect.py', 'site/journals.py', 'site/journal_metadata.py', 'site/journals.json', 'site/enrichment.py', 'site/site_topics.py', 'site/topics*.py', 'site/topics/**', 'site/build.py', 'site/update_status.py', 'site/deployment_manifest.py', 'scripts/probe_update_failure.py', 'site/sources.json', 'site/requirements.txt', '.github/workflows/ai4s-pages.yml']

concurrency:
  group: ai4s-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: site/requirements.txt
      - name: Install collector dependencies
        run: pip install -r site/requirements.txt
      - name: Restore durable archive
        id: state
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin site-data >/dev/null; then
            git fetch origin site-data
            git worktree add --detach "$RUNNER_TEMP/ai4s-state" FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/ai4s-state"
            git -C "$RUNNER_TEMP/ai4s-state" checkout --orphan site-data
            git -C "$RUNNER_TEMP/ai4s-state" rm -rf .
          fi
          echo "archive_revision=$(git -C "$RUNNER_TEMP/ai4s-state" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Reserve daily Bohrium allowance before any billable request
        id: bohr_budget
        env:
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
          BOHR_ACCESS_KEY: ${{ secrets.BOHR_ACCESS_KEY }}
        shell: bash
        run: |
          allowance=$(python site/enrichment.py --reserve "$RUNNER_TEMP/ai4s-state/.bohr-budget.json")
          if [ "$allowance" -gt 0 ]; then
            git -C "$RUNNER_TEMP/ai4s-state" add .bohr-budget.json
            git -C "$RUNNER_TEMP/ai4s-state" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Reserve bounded daily content enrichment calls'
            git -C "$RUNNER_TEMP/ai4s-state" push origin HEAD:site-data
          fi
          echo "allowance=$allowance" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        id: bohr_node
        continue-on-error: true
        if: steps.bohr_budget.outputs.allowance != '0'
        with:
          node-version: '22'
      - name: Install pinned Bohrium CLI
        id: bohr_cli
        continue-on-error: true
        if: steps.bohr_budget.outputs.allowance != '0' && steps.bohr_node.outcome == 'success'
        env:
          BOHR_ACCESS_KEY: ${{ secrets.BOHR_ACCESS_KEY }}
        run: |
          npm install --global @dptech-corp/bohr-cli@2.7.11 --registry https://registry.npmjs.org
          bohr version
          python - <<'PY'
          import json, subprocess
          result = subprocess.run(['bohr','auth','status','--verify','-o','json'],capture_output=True,text=True,timeout=30)
          try:
              payload = json.loads(result.stdout)
              valid = result.returncode == 0 and payload.get('ok') is True and payload.get('data',{}).get('verified') is True
          except ValueError: valid = False
          print('Bohrium authentication verified:', valid)
          if not valid: raise SystemExit(1)
          PY
      - name: Download latest ranked papers
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ai4s-papers"
          artifact=$(gh api "repos/$REPOSITORY/actions/artifacts?name=ai4s-ranked-papers&per_page=10" --jq '[.artifacts[] | select(.expired == false)][0].id // empty')
          if [ -n "$artifact" ]; then
            gh api "repos/$REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/papers.zip"
            unzip -q "$RUNNER_TEMP/papers.zip" -d "$RUNNER_TEMP/ai4s-papers"
          else
            echo 'No ranked-paper artifact yet; news collection will continue.'
          fi
      - name: Collect and summarize official sources
        id: collect
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHAXIV_API_KEY: ${{ secrets.ALPHAXIV_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
          BOHR_ACCESS_KEY: ${{ secrets.BOHR_ACCESS_KEY }}
          BOHR_CALL_ALLOWANCE: ${{ steps.bohr_cli.outcome == 'success' && steps.bohr_budget.outputs.allowance || '0' }}
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          ZOTERO_TOPIC_CONFIG: ${{ secrets.ZOTERO_TOPIC_CONFIG }}
          TOPICS_MODE: v2
          FAILURE_PROBE: ${{ inputs.failure_probe }}
        run: |
          if [[ "$FAILURE_PROBE" == taxonomy || "$FAILURE_PROBE" == classification ]]; then
            python scripts/probe_update_failure.py --stage "$FAILURE_PROBE" --data-dir "$RUNNER_TEMP/ai4s-state/data" --report "$RUNNER_TEMP/update-failure.json"
          else
            python site/collect.py --data-dir "$RUNNER_TEMP/ai4s-state/data" --paper-export "$RUNNER_TEMP/ai4s-papers/papers.json" --failure-report "$RUNNER_TEMP/update-failure.json"
          fi
      - name: Build static site
        id: candidate
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python site/build.py --data-dir "$RUNNER_TEMP/ai4s-state/data" --output _site
      - name: Commit public archive
        if: steps.collect.outcome == 'success' && steps.candidate.outcome == 'success'
        shell: bash
        run: |
          git -C "$RUNNER_TEMP/ai4s-state" add data
          if ! git -C "$RUNNER_TEMP/ai4s-state" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/ai4s-state" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Archive AI4S source metadata'
            git -C "$RUNNER_TEMP/ai4s-state" push origin HEAD:site-data
          fi
      - name: Record exact deployed archive and assets
        if: steps.collect.outcome == 'success' && steps.candidate.outcome == 'success'
        run: python site/deployment_manifest.py --output _site --code-revision "$GITHUB_SHA" --archive-revision "$(git -C "$RUNNER_TEMP/ai4s-state" rev-parse HEAD)"
      - name: Retain the valid snapshot after a failed update
        if: steps.collect.outcome == 'failure' || steps.candidate.outcome == 'failure'
        env:
          ARCHIVE_SHA: ${{ steps.state.outputs.archive_revision }}
        run: |
          mkdir -p "$RUNNER_TEMP/retained"
          git -C "$RUNNER_TEMP/ai4s-state" archive "$ARCHIVE_SHA" data | tar -x -C "$RUNNER_TEMP/retained"
          rm -rf _site
          python site/build.py --data-dir "$RUNNER_TEMP/retained/data" --output _site
          python site/deployment_manifest.py --output _site --code-revision "$GITHUB_SHA" --archive-revision "$ARCHIVE_SHA" --mode retention
          python site/update_status.py --output _site --status error --stage build --failure-report "$RUNNER_TEMP/update-failure.json" --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo '::warning::Update failed; publishing only the unchanged valid archive and public attempt status.'
      - name: Record successful attempt
        if: steps.collect.outcome == 'success' && steps.candidate.outcome == 'success'
        run: python site/update_status.py --output _site --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
